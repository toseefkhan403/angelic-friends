workflows:
  ios-release:
    name: iOS Release (TestFlight)
    max_build_duration: 120
    instance_type: mac_mini_m2

    # One-time setup required in the Codemagic UI before this workflow can
    # run (none of this can be done from a CSR/OpenSSL flow on Windows):
    #   1. Connect this repo to a Codemagic app.
    #   2. Team settings → Integrations → App Store Connect → add an API key
    #      (App Store Connect → Users and Access → Keys). Role must be
    #      "App Manager" or higher — "Developer"/lower roles cannot create
    #      certificates or provisioning profiles via the API. Name the
    #      integration exactly "codemagic" to match the reference below, or
    #      rename the line below to match whatever you name it.
    #   3. Create the app in App Store Connect with bundle id
    #      com.sponsoradog.sponsorADog (the App ID must already exist in
    #      the Apple Developer portal — Codemagic can create certs/profiles
    #      on demand, but not the App ID itself).
    #
    # The "Fetch signing files" script below is what actually creates the
    # Apple Distribution certificate + provisioning profile on first run
    # (via --create) — the declarative environment.ios_signing shortcut
    # only matches against signing files Codemagic already has on file, so
    # it fails with "No matching profiles found" on a brand new app. This
    # script sequence mirrors Codemagic's own official
    # ios-automatic-code-signing-demo-project.
    integrations:
      app_store_connect: codemagic

    environment:
      vars:
        BUNDLE_ID: com.sponsoradog.sponsorADog
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Set up keychain for code signing
        script: keychain initialize

      - name: Fetch signing files
        script: app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;

      - name: Flutter build ipa
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # Leave submit_to_testflight: false until the App Store Connect app
      # record exists (see setup note above) — otherwise this step fails
      # rather than the build. Flip to true once that's in place.
      app_store_connect:
        auth: integration
        submit_to_testflight: false
